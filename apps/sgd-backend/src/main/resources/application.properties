# ===================================
# SGD Backend Configuration
# Sistema de Gestión Deportiva
# ===================================

# Server Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.root-path=/api

# CORS Configuration for Frontend
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,https://localhost:3000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgd}
quarkus.datasource.username=${DB_USER:sgd_user}
quarkus.datasource.password=${DB_PASSWORD:sgd_password}
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=10

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.show-sql=false
quarkus.hibernate-orm.format-sql=true
quarkus.hibernate-orm.jdbc.statement-batch-size=25
quarkus.hibernate-orm.fetch.batch-size=16

# Flyway Migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.table=sgd_flyway_schema_history
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# Keycloak OIDC Configuration  
quarkus.oidc.auth-server-url=http://localhost:8089/realms/SGD
quarkus.oidc.client-id=sgd-backend
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:sgd-backend-secret}
quarkus.oidc.token.issuer=http://localhost:8089/realms/SGD
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken

# Security Configuration
quarkus.http.auth.proactive=false
quarkus.security.jaxrs.deny-unannotated-endpoints=false

# OpenAPI Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=SGD Backend API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Sistema de Gestión Deportiva - API Backend
mp.openapi.extensions.smallrye.info.contact.name=SGD Development Team
mp.openapi.extensions.smallrye.info.contact.email=dev@sgd.com

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.sgd".level=DEBUG
quarkus.log.category."io.quarkus.oidc".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE

# Jackson Configuration
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization.write-dates-as-timestamps=false
quarkus.jackson.deserialization.fail-on-unknown-properties=false
quarkus.jackson.serialization.indent-output=false

# Health Check
quarkus.smallrye-health.root-path=/health
quarkus.health.extensions.enabled=true

# Application Properties
sgd.pagination.default-size=20
sgd.pagination.max-size=50
sgd.business.adult-age=18
sgd.validation.phone-regex=^\\+503\\s[0-9]{4}-[0-9]{4}$