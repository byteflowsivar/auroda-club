# Test Configuration
quarkus.test.profile=test

# Database Configuration for Testing
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sgd_test
quarkus.datasource.username=sgd_test_user
quarkus.datasource.password=sgd_test_pass

# Use TestContainers for database
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:15-alpine
quarkus.datasource.devservices.username=test
quarkus.datasource.devservices.password=test
quarkus.datasource.devservices.db-name=sgd_test

# Hibernate Configuration for Testing
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=test-data.sql

# Disable Flyway for tests (use Hibernate DDL)
quarkus.flyway.migrate-at-start=false

# Mock OIDC Configuration for Testing
quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false

# Test OIDC Server
quarkus.test.oidc-server.users.admin=admin
quarkus.test.oidc-server.users.admin.password=admin
quarkus.test.oidc-server.users.admin.roles=ADMIN_GENERAL
quarkus.test.oidc-server.users.admin.claims.club_id=1
quarkus.test.oidc-server.users.admin.claims.venue_ids=[1,2,3]
quarkus.test.oidc-server.users.admin.claims.full_name=Admin General

quarkus.test.oidc-server.users.club_admin=club_admin
quarkus.test.oidc-server.users.club_admin.password=club_admin
quarkus.test.oidc-server.users.club_admin.roles=ADMIN_CLUB
quarkus.test.oidc-server.users.club_admin.claims.club_id=1
quarkus.test.oidc-server.users.club_admin.claims.venue_ids=[1,2]
quarkus.test.oidc-server.users.club_admin.claims.full_name=Club Admin

quarkus.test.oidc-server.users.profesor=profesor
quarkus.test.oidc-server.users.profesor.password=profesor
quarkus.test.oidc-server.users.profesor.roles=PROFESOR
quarkus.test.oidc-server.users.profesor.claims.club_id=1
quarkus.test.oidc-server.users.profesor.claims.venue_ids=[1]
quarkus.test.oidc-server.users.profesor.claims.full_name=Profesor Test

# Logging for Testing
quarkus.log.level=WARN
quarkus.log.category."com.sgd".level=DEBUG
quarkus.log.category."io.quarkus.test".level=INFO

# OpenAPI disabled for tests
quarkus.swagger-ui.always-include=false

# Application Properties for Testing
sgd.pagination.default-size=10
sgd.pagination.max-size=20
sgd.business.adult-age=18